<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nairafund</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col justify-between">

    <header class="bg-zinc-900 border-b border-zinc-800 px-6 py-4 flex justify-between items-center sticky top-0 z-40">
        <div class="flex items-center space-x-6">
            <h2 class="text-2xl font-bold text-emerald-400">Nairafund</h2>
            <nav class="hidden md:flex space-x-4 text-zinc-400">
                <a href="#" class="hover:text-white">Home</a>
                <a href="#" class="hover:text-white">Referral</a>
                <a href="#" class="text-emerald-400 border-b-2 border-emerald-400 pb-1">Withdraw</a>
            </nav>
        </div>
        <div class="flex items-center space-x-4">
            <i class="fa-solid fa-bell text-zinc-400 hover:text-white cursor-pointer"></i>
            <div class="w-8 h-8 bg-emerald-500 text-black font-bold rounded-full flex items-center justify-center">U</div>
        </div>
    </header>

    <main class="flex-1 flex items-center justify-center p-6">
        <div class="w-full max-w-md bg-zinc-900/50 border border-zinc-800/80 rounded-3xl p-8 shadow-xl">
            <h2 class="text-2xl font-bold text-center mb-8">Request Withdrawal</h2>
            
            <div class="space-y-5">
                <div>
                    <label class="text-sm text-zinc-400 block mb-2">Full Name</label>
                    <input type="text" value="Fabian Emmanuel" readonly class="w-full bg-zinc-800/60 border border-zinc-700/50 rounded-2xl px-5 py-4 text-zinc-300 focus:outline-none">
                </div>
                
                <div>
                    <label class="text-sm text-zinc-400 block mb-2">Phone Number</label>
                    <input type="text" value="+2348158331002" readonly class="w-full bg-zinc-800/60 border border-zinc-700/50 rounded-2xl px-5 py-4 text-zinc-300 focus:outline-none">
                </div>
                
                <div>
                    <label class="text-sm text-zinc-400 block mb-2">Account Number</label>
                    <input type="text" value="0068046043" readonly class="w-full bg-zinc-800/60 border border-zinc-700/50 rounded-2xl px-5 py-4 text-zinc-300 focus:outline-none">
                </div>
                
                <button onclick="openWithdrawalModal()" class="w-full bg-emerald-500 hover:bg-emerald-600 active:scale-[0.99] text-zinc-950 font-bold py-4 rounded-2xl mt-4 transition tracking-wide">
                    SUBMIT REQUEST
                </button>
            </div>
        </div>
    </main>

    <div id="withdrawal-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 p-4">
        <div class="bg-zinc-900 border border-zinc-800 rounded-3xl w-full max-w-md p-6 max-h-[90vh] overflow-y-auto">
            
            <div id="modal-step-input">
                <div class="text-center mb-6">
                    <div class="w-12 h-12 bg-emerald-500/10 text-emerald-400 rounded-full flex items-center justify-center mx-auto mb-3 text-xl">
                        <i class="fa-solid fa-circle-check"></i>
                    </div>
                    <h3 class="text-xl font-bold text-emerald-400">Congratulations!</h3>
                    <p class="text-zinc-400 text-sm mt-1">Your withdrawal request has been received.</p>
                </div>

                <div class="border-t border-zinc-800 pt-4 mb-5">
                    <label class="text-sm font-medium text-zinc-300 block mb-2">Enter 8-Digit Withdrawal Code</label>
                    <input id="withdrawal-code" type="text" maxlength="8" placeholder="********" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-3 text-center tracking-widest font-mono text-white focus:outline-none focus:border-emerald-500">
                </div>

                <div class="bg-zinc-800/50 border border-zinc-700/30 rounded-2xl p-4 mb-5 space-y-3">
                    <p class="text-xs text-amber-400 font-semibold uppercase tracking-wider">How to get a code:</p>
                    <p class="text-sm text-zinc-300">Buy a withdrawal code for <span class="text-emerald-400 font-bold">₦10,000</span> via the payment method below:</p>
                    
                    <div class="bg-zinc-900 p-3 rounded-xl border border-zinc-800 space-y-1">
                        <span class="text-xs text-zinc-500 block">Payment Method</span>
                        <span class="text-sm font-medium text-white block">iLotBet</span>
                        <span class="text-xs text-zinc-5
